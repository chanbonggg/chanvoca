services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chanvoca
      POSTGRES_USER: chanvoca
      POSTGRES_PASSWORD: chanvoca
    ports:
      - "5432:5432"
    volumes:
      - chanvoca_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chanvoca -d chanvoca"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chanvoca_postgres:

